<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Vivek Yadav — Engineering ideas into software</title>
  <desc id="desc">A dark editorial banner with warm ivory typography, amber accents, and a geometric engineering-inspired mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="0.58" stop-color="#1A232C"/>
      <stop offset="1" stop-color="#202A32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1D2A0"/>
      <stop offset="1" stop-color="#C18B4D"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0" stop-color="#C18B4D" stop-opacity=".17"/>
      <stop offset="1" stop-color="#C18B4D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#AAB5BE" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="650" y="0" width="550" height="320" fill="url(#grid)" opacity=".72"/>
  <path d="M0 280H1200" stroke="#E8C18D" stroke-opacity=".22"/>
  <path d="M68 54H112" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <text x="68" y="91" fill="#D9B783" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3.2">VIVEK YADAV  /  ENGINEERING LOG</text>
  <text x="68" y="165" fill="#F4F0E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1.8">Engineering ideas</text>
  <text x="68" y="222" fill="#F4F0E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1.8">into <tspan fill="#E2B777">software.</tspan></text>
  <text x="70" y="260" fill="#B8C0C5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing=".15">CS undergraduate  ·  AI applications  ·  Full-stack development  ·  Data systems</text>

  <g transform="translate(914 158)">
    <circle r="117" fill="none" stroke="#A8B2B8" stroke-opacity=".17" stroke-width="1.2"/>
    <circle r="91" fill="none" stroke="#D6AD76" stroke-opacity=".36" stroke-width="1.2" stroke-dasharray="2 8"/>
    <path d="M-74 -58L0 76L74 -58" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-42 -20L0 54L42 -20" fill="none" stroke="#F1D5AB" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="0" cy="76" r="7" fill="#F0C58F"/>
    <circle cx="-74" cy="-58" r="5" fill="#D8B47E"/>
    <circle cx="74" cy="-58" r="5" fill="#D8B47E"/>
    <path d="M-117 0H-91M91 0H117M0 -117V-91M0 91V117" stroke="#A8B2B8" stroke-opacity=".32" stroke-width="1.3"/>
  </g>

  <g transform="translate(1080 75)" opacity=".78">
    <rect width="46" height="30" rx="8" fill="#E7BD83" fill-opacity=".10" stroke="#E7BD83" stroke-opacity=".52"/>
    <path d="M14 10L9 15L14 20M32 10L37 15L32 20M26 8L20 22" fill="none" stroke="#E7BD83" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1080" y="249" fill="#B8C0C5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="2.2" text-anchor="middle">BUILD · LEARN · ITERATE</text>
  <circle cx="1142" cy="280" r="3" fill="#E7BD83"/>
</svg>
